name: Validar REA Hub

on:
  workflow_dispatch:
  push:
    paths:
      - "painel/**"
      - "package.json"
      - "scripts/preparar-rea-android.sh"
      - "scripts/analisar-android.sh"
      - "scripts/rea-hub-mobile.sh"
      - ".github/workflows/testar-painel.yml"

jobs:
  testar-painel:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Conferir sintaxe do servidor
        run: |
          node --check painel/server.mjs
          node --check painel/public/sw.js
          node --check painel/copilot-bridge.mjs
          node --check painel/generator.mjs
          node --check painel/templates/base/app.js
          node --check painel/public/app.js
          node --check painel/server.test.mjs
      - name: Validar scripts Android
        run: bash -n scripts/preparar-rea-android.sh scripts/analisar-android.sh scripts/rea-hub-mobile.sh
      - name: Testar autenticacao e fluxo de analise
        run: npm test
