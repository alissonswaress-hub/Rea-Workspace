name: Validar TreinoLab
on:
  workflow_dispatch:
  push:
    paths:
      - "projetos/treinolab/**"
      - "package.json"
      - ".github/workflows/testar-treinolab.yml"
jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Usar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verificar sintaxe JavaScript
        run: |
          node --check projetos/treinolab/app.js
          node --check projetos/treinolab/server.mjs
          node --check projetos/treinolab/server.test.mjs
          node --check projetos/treinolab/sw.js
      - name: Testar o servidor do aplicativo
        run: npm run test:treino
      - name: Validar metadados PWA
        run: node -e 'const m=require("./projetos/treinolab/manifest.webmanifest"); console.log(m.name)'
